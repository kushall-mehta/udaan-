services:
  udaan:
    build:
      context: .
      dockerfile: Dockerfile
    image: udaan:local
    env_file:
      - .env.local
    environment:
      HOSTNAME: 0.0.0.0
      PORT: 3000
    ports:
      - "${UDAAN_PORT:-3000}:3000"
    volumes:
      - flightapi-cache:/app/.cache/flightapi
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  flightapi-cache:
